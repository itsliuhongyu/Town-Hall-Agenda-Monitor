name: Weekly Agenda Pipeline

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-pipeline:
    runs-on: self-hosted
    env:
      # This must be provisioned on the self-hosted runner outside the
      # checkout/cleanup tree. See RUNBOOK.md for setup and permissions.
      AGENDA_DATA_DIR: /var/lib/town-hall-agenda-monitor

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python venv
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pandas requests playwright openai pdfplumber python-docx beautifulsoup4 numpy
          python -m playwright install chromium

      - name: Run durable pipeline and publication gate
        run: |
          . .venv/bin/activate
          set -o pipefail
          python pipeline.py --data-dir "${AGENDA_DATA_DIR:?Set AGENDA_DATA_DIR to an isolated durable data directory}" --json | tee run-output.json
          python - <<'PY'
          import json, os, pathlib, sys
          from agenda_app.workflow_gate import eligible_mail
          result = json.loads(pathlib.Path("run-output.json").read_text())
          gate = eligible_mail(result, result.get("manifest_path", ""))
          if not gate.get("eligible"):
              sys.exit(f"publication gate rejected {gate.get('reason')}")
          manifest_path = pathlib.Path(result["manifest_path"])
          pathlib.Path(os.environ["GITHUB_ENV"]).write_text(f"AGENDA_EXPORT_DIR={manifest_path.parent}\n")
          with pathlib.Path(os.environ["GITHUB_ENV"]).open("a") as env:
              env.write(f"AGENDA_HIGH_CSV={gate['high_csv']}\nAGENDA_MAIL_ELIGIBLE=true\n")
          print(f"ready export={result['export_id']} manifest={manifest_path}")
          PY

      - name: Upload run-bound export artifact
        uses: actions/upload-artifact@v4
        with:
          name: agenda-export-${{ github.run_id }}
          path: ${{ env.AGENDA_EXPORT_DIR }}
          if-no-files-found: error

      - name: Email current high.csv
        if: env.AGENDA_MAIL_ELIGIBLE == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: Agenda Bot <${{ secrets.MAIL_USERNAME }}>
          subject: "Weekly High-Priority Agenda Items - ${{ github.run_id }}"
          body: |
            Hi,

            Attached is this week's high-priority agenda items from the current complete run.
          attachments: ${{ env.AGENDA_HIGH_CSV }}
